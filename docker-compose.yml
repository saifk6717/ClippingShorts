# ClippingShorts: multi-stream AI clipping.
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
#
# Services: frontend (Next.js) -> backend (FastAPI) ; stream-worker, ai-worker, renderer.
# Redis: by default the EXISTING Redis container on the external Docker network named in REDIS_NETWORK
# (reached by its container name, never "localhost"). If you have no Redis yet:
#   docker network create clippingshorts_redis
#   and in .env: COMPOSE_PROFILES=bundled-redis  REDIS_NETWORK=clippingshorts_redis  REDIS_URL=redis://redis:6379/4
# Database: SQLite on the data volume (no extra service). Set DATABASE_URL to use PostgreSQL instead.
#
# Memory/CPU limits below fit a 2 vCPU / 12 GB VM that also runs other apps. They are a safety net; the admission
# controller inside the app keeps work below them. Measure with scripts/loadtest.py and tune for your machine.

x-backend-env: &backend-env
  env_file: .env
  environment:
    CLIPPINGSHORTS_DATA_DIR: /data/clippingshorts
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  backend:
    build: { context: ./backend }
    image: clippingshorts-backend:local
    <<: [*backend-env, *logging]
    restart: unless-stopped
    networks: [internal, redis_net]
    volumes: ["data:/data/clippingshorts"]
    secrets: [google_service_account]
    expose: ["8000"]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s

  stream-worker:
    build:
      context: ./workers/stream
      additional_contexts: { backend_image: "service:backend" }
    image: clippingshorts-stream-worker:local
    <<: [*backend-env, *logging]
    restart: unless-stopped
    depends_on: { backend: { condition: service_healthy } }
    networks: [internal, redis_net]
    volumes: ["data:/data/clippingshorts"]
    secrets: [google_service_account]
    mem_limit: ${STREAM_WORKER_MEM_LIMIT:-1536m}
    memswap_limit: ${STREAM_WORKER_MEM_LIMIT:-1536m}
    cpus: ${STREAM_WORKER_CPUS:-1.5}
    cpu_shares: 1536            # ingestion wins over rendering when the CPU is contended
    oom_score_adj: -200         # if the kernel must kill something, prefer the renderer
    stop_grace_period: 40s

  ai-worker:
    build:
      context: ./workers/ai
      additional_contexts: { backend_image: "service:backend" }
    image: clippingshorts-ai-worker:local
    <<: [*backend-env, *logging]
    restart: unless-stopped
    depends_on: { backend: { condition: service_healthy } }
    networks: [internal, redis_net]
    volumes: ["data:/data/clippingshorts"]
    secrets: [google_service_account]
    mem_limit: ${AI_WORKER_MEM_LIMIT:-512m}
    memswap_limit: ${AI_WORKER_MEM_LIMIT:-512m}
    cpus: ${AI_WORKER_CPUS:-0.75}
    stop_grace_period: 30s

  renderer:
    build:
      context: ./workers/renderer
      additional_contexts: { backend_image: "service:backend" }
    image: clippingshorts-renderer:local
    <<: [*backend-env, *logging]
    restart: unless-stopped
    depends_on: { backend: { condition: service_healthy } }
    networks: [internal, redis_net]
    volumes: ["data:/data/clippingshorts"]
    secrets: [google_service_account]
    mem_limit: ${RENDERER_MEM_LIMIT:-1024m}
    memswap_limit: ${RENDERER_MEM_LIMIT:-1024m}
    cpus: ${RENDERER_CPUS:-1.5}
    cpu_shares: 512
    oom_score_adj: 500
    stop_grace_period: 60s

  frontend:
    build: { context: ./frontend }
    image: clippingshorts-frontend:local
    <<: *logging
    restart: unless-stopped
    depends_on: { backend: { condition: service_healthy } }
    environment:
      BACKEND_URL: http://backend:8000
    networks: [internal]
    ports: ["${CLIPPINGSHORTS_FRONTEND_BIND:-0.0.0.0}:${CLIPPINGSHORTS_FRONTEND_PORT:-3100}:3000"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5

  # only when no Redis exists yet: COMPOSE_PROFILES=bundled-redis
  redis:
    profiles: ["bundled-redis"]
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    networks: [redis_net]           # never published on a host port
    volumes: ["redis_data:/data"]
    mem_limit: 320m

networks:
  internal:
    name: clippingshorts_internal
  redis_net:
    external: true
    name: ${REDIS_NETWORK:-redis_redis_network}

volumes:
  data:
    name: clippingshorts_data
  redis_data:

secrets:
  google_service_account:
    file: ${GOOGLE_SERVICE_ACCOUNT_FILE:?set GOOGLE_SERVICE_ACCOUNT_FILE in .env (path to the service-account JSON)}
